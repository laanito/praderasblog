# 
# Basic
#
site_title: Blog Praderas
# Canonical URL for this deployment (sitemap, OG URLs, and Pico links). Root domain praderas.org is separate infra.
base_url: https://blog.praderas.org
rewrite_url: true

#
# Search plugin — Spanish stopwords (reduces noise for multi-word queries)
#
PicoSearch:
  low_value_words:
    - a
    - al
    - como
    - con
    - de
    - del
    - el
    - en
    - es
    - esa
    - ese
    - este
    - ha
    - las
    - le
    - les
    - lo
    - los
    - me
    - mi
    - mis
    - mucho
    - muy
    - nos
    - o
    - os
    - para
    - por
    - que
    - se
    - sin
    - son
    - su
    - sus
    - te
    - tu
    - tus
    - un
    - una
    - uno
    - y
    - ya
  low_value_words_en:
    - a
    - an
    - and
    - are
    - as
    - at
    - be
    - but
    - by
    - for
    - from
    - has
    - have
    - how
    - in
    - is
    - it
    - its
    - of
    - on
    - or
    - that
    - the
    - their
    - this
    - to
    - was
    - we
    - were
    - what
    - when
    - where
    - which
    - who
    - will
    - with
    - your

#
# Themes
#

theme: bootstrap-blog


# 
# Pagination
#

pagination_limit: 10
pagination_sub_page: true
pagination_page_indicator: "blog"
pagination_prev_text: "Entradas anteriores"
pagination_next_text: "Entradas recientes"

#
# Visit stats (Redis-backed counters — see plugins/68-VisitStats.php)
#
VisitStats:
  enabled: true
  redis_host: 127.0.0.1
  redis_port: 6379
  redis_prefix: praderas:stats
  skip_bots: true
  exclude_self: true
  disk_save: true
  disk_dir: var/visit-stats


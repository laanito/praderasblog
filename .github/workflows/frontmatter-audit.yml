name: Frontmatter audit

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run frontmatter audit
        run: python3 scripts/frontmatter_audit.py
      - name: Pregenerate JSON snapshots
        run: python3 scripts/pregenerate_blog_json.py
